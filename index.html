<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تولدت مبارک!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
            z-index: 10;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 15px;
            color: #e94560;
            text-shadow: 0 0 10px rgba(233,69,96,0.5);
        }
        p {
            font-size: 1.1rem;
            margin-bottom: 25px;
            color: #d3d3d3;
        }
        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(233,69,96,0.4);
        }
        button:hover {
            background: #ff6b81;
            transform: scale(1.05);
        }
        .cake-splat {
            position: fixed;
            left: 50%;
            top: 50%;
            font-size: 24px;
            animation: splatAnim 1s cubic-bezier(0.1, 1, 0.3, 1) forwards;
            z-index: 999;
            pointer-events: none;
        }
        @keyframes splatAnim {
            0% {
                transform: translate(0, 0) scale(0.2);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(1.2);
                opacity: 0.9;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🎉 تولدت مبارک! 🎂</h1>
        <p>آماده‌ای کیک بخوره تو صورتت؟</p>
        <button id="btnClick">بزن روی من!</button>
    </div>

    <script>
        function playBirthdaySong() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const notes = [262, 262, 294, 262, 349, 330];
                const times = [200, 200, 400, 400, 400, 600];
                
                let delay = 0;
                notes.forEach((note, index) => {
                    setTimeout(() => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.value = note;
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start();
                        gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.3);
                        osc.stop(ctx.currentTime + 0.3);
                    }, delay);
                    delay += times[index];
                });
            } catch(e) {}
        }

        function createCakeSplat() {
            const items = ['🍰', '🎂', '🧁', '🍦', '⚪', '🟡', '🍓', '✨'];
            
            for (let i = 0; i < 40; i++) {
                const splat = document.createElement('div');
                splat.classList.add('cake-splat');
                splat.innerText = items[Math.floor(Math.random() * items.length)];
                
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * (window.innerWidth * 0.45) + 30;
                const tx = Math.cos(angle) * distance + 'px';
                const ty = Math.sin(angle) * distance + 'px';
                const rot = (Math.random() * 720 - 360) + 'deg';
                
                splat.style.setProperty('--tx', tx);
                splat.style.setProperty('--ty', ty);
                splat.style.setProperty('--rot', rot);
                splat.style.fontSize = (Math.random() * 30 + 15) + 'px';
                
                document.body.appendChild(splat);
            }
        }

        document.getElementById('btnClick').addEventListener('click', function() {
            playBirthdaySong();
            createCakeSplat();
        });
    </script>
</body>
</html>
